# Cấu hình Cloudflare Pages cho Polylingo (dùng wrangler@3).
# Không chứa bí mật: database_id chỉ là mã định danh, khóa API để ở GitHub Secrets.
name = "polylingo"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "polylingo-db"
database_id = "18d7d596-dbad-423f-820c-d12135746125"   # D1 polylingo-db (tài khoản Cloudflare giữ polylingo.pages.dev)
migrations_dir = "migrations"

# Biến công khai (dashboard chỉ cho sửa Secret vì biến thường được quản lý ở file này).
# TURNSTILE_SECRET_KEY là Secret, đặt trong Cloudflare: Workers & Pages → polylingo → Settings → Variables and secrets.
[vars]
TURNSTILE_SITE_KEY = "0x4AAAAAAGWmgjCvgFo3ENcl"
